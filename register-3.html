<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Регистрация, шаг 3 — SkillSwap</title>
	<link rel="icon" href="assets/favicon.ico" sizes="any">
	<link rel="icon" type="image/png" href="assets/favicon.png">
	<link rel="stylesheet" href="assets/css/fonts.css">
	<link rel="stylesheet" href="assets/css/globals.css">
	<link rel="stylesheet" href="assets/css/base.css">
	<link rel="stylesheet" href="assets/css/components.css">
	<link rel="stylesheet" href="assets/css/layout.css">
</head>

<body>
	<div class="page">

		<header class="header">
			<div class="container auth-header">
				<a class="logo" href="home.html">
					<span class="logo__mark"><svg class="icon" aria-hidden="true">
							<use href="assets/svg/sprite.svg#i-logo-mark"></use>
						</svg></span>
					SkillSwap
				</a>
				<div class="auth-header__step">
					<p class="auth-header__title">Шаг 3 из 3</p>
					<div class="steps">
						<span class="steps__item is-done"></span>
						<span class="steps__item is-done"></span>
						<span class="steps__item is-done"></span>
					</div>
				</div>
				<a class="btn auth-header__close" href="home.html">
					Закрыть
					<svg class="icon" aria-hidden="true">
						<use href="assets/svg/sprite.svg#i-cross"></use>
					</svg>
				</a>
			</div>
		</header>

		<main class="page__main">
			<div class="container">

				<div class="auth">

					<section class="auth__panel">
						<form class="auth__form" novalidate>
							<div class="field">
								<label class="field__label" for="skill-name">Название навыка</label>
								<div class="input-wrap">
									<input class="input" id="skill-name" type="text" placeholder="Введите название навыка">
								</div>
							</div>

							<div class="field">
								<span class="field__label" id="skill-cat-label">Категория навыка</span>
								<div class="select">
									<button class="select__toggle" type="button" aria-expanded="false" aria-labelledby="skill-cat-label">
										<span class="select__value select__placeholder">Выберите категорию</span>
										<svg class="icon" aria-hidden="true">
											<use href="assets/svg/sprite.svg#i-chevron-down"></use>
										</svg>
									</button>
									<div class="select__menu">
										<button class="select__option" type="button">Бизнес и карьера</button>
										<button class="select__option" type="button">Творчество и искусство</button>
										<button class="select__option" type="button">Иностранные языки</button>
										<button class="select__option" type="button">Образование и развитие</button>
										<button class="select__option" type="button">Здоровье и лайфстайл</button>
										<button class="select__option" type="button">Дом и уют</button>
									</div>
								</div>
							</div>

							<div class="field">
								<span class="field__label" id="skill-sub-label">Подкатегория навыка</span>
								<div class="select">
									<button class="select__toggle" type="button" aria-expanded="false" aria-labelledby="skill-sub-label">
										<span class="select__value select__placeholder">Выберите подкатегорию</span>
										<svg class="icon" aria-hidden="true">
											<use href="assets/svg/sprite.svg#i-chevron-down"></use>
										</svg>
									</button>
									<div class="select__menu">
										<button class="select__option" type="button">Рисование и иллюстрация</button>
										<button class="select__option" type="button">Фотография</button>
										<button class="select__option" type="button">Видеомонтаж</button>
										<button class="select__option" type="button">Музыка и звук</button>
										<button class="select__option" type="button">Актёрское мастерство</button>
										<button class="select__option" type="button">Креативное письмо</button>
										<button class="select__option" type="button">Арт-терапия</button>
										<button class="select__option" type="button">Декор и DIY</button>
									</div>
								</div>
							</div>

							<div class="field">
								<label class="field__label" for="skill-about">Описание</label>
								<div class="input-wrap">
									<textarea class="input" id="skill-about" placeholder="Коротко опишите, чему можете научить"></textarea>
								</div>
							</div>

							<div class="field">
								<span class="field__label">Фотографии навыка</span>
								<button class="btn btn--secondary btn--block" type="button">
									<svg class="icon" aria-hidden="true"><use href="assets/svg/sprite.svg#i-gallery-add"></use></svg>
									Добавить фото
								</button>
							</div>

							<div class="field-row">
								<a class="btn btn--secondary" href="register-2.html">Назад</a>
								<a class="btn btn--primary" href="catalog.html">Продолжить</a>
							</div>
						</form>
					</section>

					<section class="auth__panel auth__aside">
						<img src="assets/svg/light-bulb.svg" alt="" width="300" height="300">
						<h1>Укажите, чем вы готовы поделиться</h1>
						<p>Так другие люди смогут найти вас и предложить обмен</p>
					</section>

				</div>
			</div>
		</main>

	</div>
	<script src="assets/js/main.js"></script>
</body>

</html>
