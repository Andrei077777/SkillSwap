<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Вход — SkillSwap</title>
	<link rel="icon" href="assets/favicon.ico" sizes="any">
	<link rel="icon" type="image/png" href="assets/favicon.png">
	<link rel="stylesheet" href="assets/css/fonts.css">
	<link rel="stylesheet" href="assets/css/globals.css">
	<link rel="stylesheet" href="assets/css/base.css">
	<link rel="stylesheet" href="assets/css/components.css">
	<link rel="stylesheet" href="assets/css/layout.css">
</head>

<body>
	<div class="page">

		<header class="header">
			<div class="container auth-header">
				<a class="logo" href="home.html">
					<span class="logo__mark"><svg class="icon" aria-hidden="true">
							<use href="assets/svg/sprite.svg#i-logo-mark"></use>
						</svg></span>
					SkillSwap
				</a>
				<p class="auth-header__title">Вход</p>
				<a class="btn auth-header__close" href="home.html">
					Закрыть
					<svg class="icon" aria-hidden="true">
						<use href="assets/svg/sprite.svg#i-cross"></use>
					</svg>
				</a>
			</div>
		</header>

		<main class="page__main">
			<div class="container">

				<div class="auth">

					<section class="auth__panel">
						<form class="auth__form" novalidate>
							<button class="btn btn--secondary btn--block" type="button">
								<svg class="icon" aria-hidden="true">
									<use href="assets/svg/sprite.svg#i-google"></use>
								</svg>
								Продолжить с Google
							</button>
							<button class="btn btn--secondary btn--block" type="button">
								<svg class="icon" aria-hidden="true">
									<use href="assets/svg/sprite.svg#i-apple"></use>
								</svg>
								Продолжить с Apple
							</button>

							<p class="divider">или</p>

							<div class="field">
								<label class="field__label" for="email">Email</label>
								<div class="input-wrap">
									<input class="input" id="email" type="email" placeholder="Введите email" autocomplete="email">
								</div>
							</div>

							<div class="field">
								<label class="field__label" for="password">Пароль</label>
								<div class="input-wrap">
									<input class="input" id="password" type="password" placeholder="Введите ваш пароль" autocomplete="current-password">
									<button class="input-wrap__action" type="button" data-password-toggle aria-label="Показать пароль">
										<svg class="icon" aria-hidden="true">
											<use href="assets/svg/sprite.svg#i-eye"></use>
										</svg>
									</button>
								</div>
							</div>

							<button class="btn btn--primary btn--block" type="submit">Войти</button>
							<p style="text-align:center"><a href="register-2.html">Зарегистрироваться</a></p>
						</form>
					</section>

					<section class="auth__panel auth__aside">
						<img src="assets/svg/light-bulb.svg" alt="" width="300" height="300">
						<h1>С возвращением в SkillSwap!</h1>
						<p>Обменивайтесь знаниями и навыками с другими людьми</p>
					</section>

				</div>
			</div>
		</main>

	</div>
	<script src="assets/js/main.js"></script>
</body>

</html>
